name: Check and publish

# Every five minutes (GitHub can run a scheduled job a few minutes late): check, record, publish.
# A push to main (an edited page or notice) only publishes.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        if: github.event_name != 'push'
        run: node check.mjs
      - name: Record
        if: github.event_name != 'push'
        run: |
          git config user.name "assess-status"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/summary.json
          git commit -q -m "Check $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull -q --rebase && git push -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
